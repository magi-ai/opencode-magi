query mergeQueueStatus($owner: String!, $repo: String!, $pr: Int!) {
  repository(owner: $owner, name: $repo) {
    pullRequest(number: $pr) {
      state
      isInMergeQueue
      mergeQueueEntry {
        id
      }
      timelineItems(last: 1, itemTypes: REMOVED_FROM_MERGE_QUEUE_EVENT) {
        nodes {
          ... on RemovedFromMergeQueueEvent {
            createdAt
            reason
          }
        }
      }
    }
  }
}
