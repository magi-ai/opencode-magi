name: Merge

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}

jobs:
  merge:
    if: ${{(github.event_name == 'pull_request' && github.actor == 'hirotomoyamada' && github.event.pull_request.user.login == 'hirotomoyamada' && !github.event.pull_request.draft && !contains(github.event.pull_request.labels.*.name, 'magi:merge')) || (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.issue.user.login == 'hirotomoyamada' && github.event.comment.user.login == 'hirotomoyamada' && !contains(github.event.issue.labels.*.name, 'magi:merge'))}}
    name: Merge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup node and pnpm
        uses: ./.github/composite-actions/setup

      - name: Install opencode
        run: pnpm install -g opencode-ai --dangerously-allow-all-builds

      - name: Setup git worktree config
        run: git config extensions.worktreeConfig true

      - name: Setup github accounts
        env:
          CREATOR_TOKEN: ${{ secrets.PAT_TOKEN }}
          MELCHIOR_TOKEN: ${{ secrets.MELCHIOR_TOKEN }}
          BALTHASAR_TOKEN: ${{ secrets.BALTHASAR_TOKEN }}
          CASPAR_TOKEN: ${{ secrets.CASPAR_TOKEN }}
        run: |
          printf '%s' "$CREATOR_TOKEN" | gh auth login --hostname github.com --with-token
          printf '%s' "$MELCHIOR_TOKEN" | gh auth login --hostname github.com --with-token
          printf '%s' "$BALTHASAR_TOKEN" | gh auth login --hostname github.com --with-token
          printf '%s' "$CASPAR_TOKEN" | gh auth login --hostname github.com --with-token

      - name: Build
        run: pnpm build

      - name: Add label
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: gh pr edit "${{ github.event.pull_request.number || github.event.issue.number }}" --add-label "magi:merge"

      - name: Merge pull request
        env:
          OPENCODE_AUTH_CONTENT: ${{ secrets.OPENCODE_AUTH_CONTENT }}
        run: |
          opencode run --dir "$GITHUB_WORKSPACE" --model "openai/gpt-5.5" --command "magi:merge" "${{ github.event.pull_request.number || github.event.issue.number }} --sync"

      - name: Remove label
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: gh pr edit "${{ github.event.pull_request.number || github.event.issue.number }}" --remove-label "magi:merge"
