name: Merge

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Check
        id: check
        run: |
          run=false

          if [[ "${{ github.event_name }}" == "pull_request" && "${{ github.event.action }}" == "synchronize" ]]; then
            parent_count=$(gh api "repos/$GITHUB_REPOSITORY/commits/${{ github.event.pull_request.head.sha }}" --jq '.parents | length')

            if [[ "$parent_count" -gt 1 ]]; then
              printf 'run=false\n' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          if [[ "${{ github.actor }}" == "hirotomoyamada" ]]; then
            case "${{ github.event_name }}" in
              pull_request)
                author=$(jq -r '.pull_request.user.login' "$GITHUB_EVENT_PATH")
                draft=$(jq -r '.pull_request.draft' "$GITHUB_EVENT_PATH")
                has_merge_label=$(jq -r '.pull_request.labels | any(.name == "magi:merge")' "$GITHUB_EVENT_PATH")

                if [[ "$author" == "hirotomoyamada" && "$draft" == "false" && "$has_merge_label" == "false" ]]; then
                  run=true
                fi
                ;;
              issue_comment)
                is_pull_request=$(jq -r '.issue | has("pull_request")' "$GITHUB_EVENT_PATH")
                author=$(jq -r '.issue.user.login' "$GITHUB_EVENT_PATH")
                commenter=$(jq -r '.comment.user.login' "$GITHUB_EVENT_PATH")
                comment_body=$(jq -r '.comment.body' "$GITHUB_EVENT_PATH")
                has_merge_label=$(jq -r '.issue.labels | any(.name == "magi:merge")' "$GITHUB_EVENT_PATH")

                if [[ "$is_pull_request" == "true" && "$author" == "hirotomoyamada" && "$commenter" == "hirotomoyamada" && "$comment_body" == "/merge" && "$has_merge_label" == "false" ]]; then
                  run=true
                fi
                ;;
            esac
          fi

          printf 'run=%s\n' "$run" >> "$GITHUB_OUTPUT"

  merge:
    needs: check
    if: ${{ needs.check.outputs.run == 'true' }}
    name: Merge
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup node and pnpm
        uses: ./.github/composite-actions/setup

      - name: Install opencode
        run: pnpm install -g opencode-ai --dangerously-allow-all-builds

      - name: Setup git worktree config
        run: git config extensions.worktreeConfig true

      - name: Setup github accounts
        env:
          CREATOR_TOKEN: ${{ secrets.PAT_TOKEN }}
          MELCHIOR_TOKEN: ${{ secrets.MELCHIOR_TOKEN }}
          BALTHASAR_TOKEN: ${{ secrets.BALTHASAR_TOKEN }}
          CASPAR_TOKEN: ${{ secrets.CASPAR_TOKEN }}
        run: |
          printf '%s' "$CREATOR_TOKEN" | gh auth login --hostname github.com --with-token
          printf '%s' "$MELCHIOR_TOKEN" | gh auth login --hostname github.com --with-token
          printf '%s' "$BALTHASAR_TOKEN" | gh auth login --hostname github.com --with-token
          printf '%s' "$CASPAR_TOKEN" | gh auth login --hostname github.com --with-token

      - name: Build
        run: pnpm build

      - name: Add label
        run: gh pr edit "${{ github.event.pull_request.number || github.event.issue.number }}" --add-label "magi:merge"

      - name: Merge pull request
        env:
          OPENCODE_AUTH_CONTENT: ${{ secrets.OPENCODE_AUTH_CONTENT }}
        run: |
          opencode run --dir "$GITHUB_WORKSPACE" --model "openai/gpt-5.5" --command "magi:merge" "${{ github.event.pull_request.number || github.event.issue.number }} --sync"

      - name: Remove label
        if: ${{ always() }}
        run: gh pr edit "${{ github.event.pull_request.number || github.event.issue.number }}" --remove-label "magi:merge"
