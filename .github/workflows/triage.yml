name: Triage

on:
  issues:
    types: [opened, reopened, edited, labeled]
  issue_comment:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Check
        id: check
        run: |
          run=false

          case "${{ github.event_name }}" in
            issues)
              author=$(jq -r '.issue.user.login' "$GITHUB_EVENT_PATH")
              has_triage_label=$(jq -r '.issue.labels | any(.name == "magi:triage")' "$GITHUB_EVENT_PATH")

              if [[ "$author" == "hirotomoyamada" && "$has_triage_label" == "false" ]]; then
                run=true
              fi
              ;;
            issue_comment)
              author=$(jq -r '.issue.user.login' "$GITHUB_EVENT_PATH")
              commenter=$(jq -r '.comment.user.login' "$GITHUB_EVENT_PATH")
              comment_body=$(jq -r '.comment.body' "$GITHUB_EVENT_PATH")
              has_triage_label=$(jq -r '.issue.labels | any(.name == "magi:triage")' "$GITHUB_EVENT_PATH")

              if [[ "$author" == "hirotomoyamada" && "$commenter" == "hirotomoyamada" && "$comment_body" == "/triage" && "$has_triage_label" == "false" ]]; then
                run=true
              fi
              ;;
          esac

          printf 'run=%s\n' "$run" >> "$GITHUB_OUTPUT"

  triage:
    needs: check
    if: ${{ needs.check.outputs.run == 'true' }}
    name: Triage
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup node and pnpm
        uses: ./.github/composite-actions/setup

      - name: Install opencode
        run: pnpm install -g opencode-ai --dangerously-allow-all-builds

      - name: Setup git worktree config
        run: git config extensions.worktreeConfig true

      - name: Setup github accounts
        env:
          CREATOR_TOKEN: ${{ secrets.PAT_TOKEN }}
          MELCHIOR_TOKEN: ${{ secrets.MELCHIOR_TOKEN }}
          BALTHASAR_TOKEN: ${{ secrets.BALTHASAR_TOKEN }}
          CASPAR_TOKEN: ${{ secrets.CASPAR_TOKEN }}
        run: |
          printf '%s' "$CREATOR_TOKEN" | gh auth login --hostname github.com --with-token
          printf '%s' "$MELCHIOR_TOKEN" | gh auth login --hostname github.com --with-token
          printf '%s' "$BALTHASAR_TOKEN" | gh auth login --hostname github.com --with-token
          printf '%s' "$CASPAR_TOKEN" | gh auth login --hostname github.com --with-token

      - name: Build
        run: pnpm build

      - name: Add label
        run: gh issue edit "${{ github.event.issue.number }}" --add-label "magi:triage"

      - name: Triage issue
        env:
          OPENCODE_AUTH_CONTENT: ${{ secrets.OPENCODE_AUTH_CONTENT }}
        run: |
          opencode run --dir "$GITHUB_WORKSPACE" --model "openai/gpt-5.5" --command "magi:triage" "${{ github.event.issue.number }} --sync"

      - name: Remove label
        if: ${{ always() }}
        run: gh issue edit "${{ github.event.issue.number }}" --remove-label "magi:triage"
